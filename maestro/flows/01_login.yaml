appId: com.mobilecompare.app
name: S1 Login
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "password-input"
- inputText: "Password123!"
- hideKeyboard
- tapOn:
    id: "login-button"
- assertVisible:
    id: "welcome-text"
